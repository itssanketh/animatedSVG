  }
  :root[data-theme="dark"] { color-scheme: dark; --ground: #08090a; --ink: #d0d6e0; --muted: #8a8c95; --line: #29292d; }
  :root[data-theme="light"] { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
    background: var(--ground); color: var(--ink);
    font: 13px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased;
  }
  main { width: 100%; max-width: 640px; }
  .plate { position: relative; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  .tag, .label, output, button { font: 11px/1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 0.02em; }
  .tag { position: absolute; top: 12px; z-index: 1; color: var(--muted); pointer-events: none; }
  #name { left: 14px; }
  #read { right: 14px; color: var(--ink); font-variant-numeric: tabular-nums; }
  .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; margin-top: 14px; }
  .label { color: var(--muted); }
  input[type="range"] {
    flex: 1 1 96px; min-width: 0; height: 32px; margin: 0; background: transparent; cursor: pointer;
    -webkit-appearance: none; appearance: none;
  }
  input[type="range"]::-webkit-slider-runnable-track { height: 1px; background: var(--muted); }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 13px; height: 13px; margin-top: -6px; border-radius: 50%;
    border: 1px solid var(--ink); background: var(--ground);
  }
  input[type="range"]::-moz-range-track { height: 1px; background: var(--muted); }
  input[type="range"]::-moz-range-thumb { width: 11px; height: 11px; border-radius: 50%; border: 1px solid var(--ink); background: var(--ground); }
  input[type="range"]:focus-visible, button:focus-visible { outline: 1.5px solid var(--ink); outline-offset: 2px; }
  output { min-width: 4ch; text-align: right; font-variant-numeric: tabular-nums; }
  button {
    height: 32px; padding: 0 12px; border: 1px solid var(--line); border-radius: 8px;
    background: transparent; color: var(--ink); cursor: pointer;
  }
  #means { margin: 14px 0 0; text-wrap: pretty; }
  #rules { margin: 6px 0 0; line-height: 1.6; }
  #error { margin: 12px 0 0; padding-left: 10px; border-left: 1px solid var(--ink); }
</style>
</head>
<body>
<main>
  <div class="plate">
    <span class="tag" id="name"></span>
    <span class="tag" id="read"></span>
    <div id="stage"></div>
  </div>
  <div class="controls">
    <label class="label" for="intensity">intensity</label>
    <input id="intensity" type="range" min="0" max="1" step="0.01" value="0.5">
    <output id="value" for="intensity"></output>
    <span class="label">theme</span>
    <button id="theme" type="button" aria-label="Switch between the light and the dark theme"></button>
  </div>
  <p id="means"></p>
  <p id="rules" class="label"></p>
  <p id="error" role="alert" hidden></p>
</main>

      const td = mix([sd * 0.35, 1, 0], [sd * 0.2, -1, -0.15]), side = [-td[1], td[0]];
      const toes = [-1, 0, 1].map((k) => [ankle[0] + td[0] * 4.4 + side[0] * k * 1.9, ankle[1] + td[1] * 4.4 + side[1] * k * 1.9, ankle[2] + td[2] * 4]);
      L.leg.setAttribute("d", soft([cap(hip, knee, 2.4, 1.4), cap(knee, ankle, 1.2, 0.9), [Wg(...ankle), ...toes.flatMap((t) => E(Wg, t, [0.6, 0.6, 0.4]))]], 3, 0.6));
      L.toes.setAttribute("d", toes.map((t) => open([Wg(...ankle), Wg(...t)])).join(""));
      // the arm reaches ahead through the hop and plants its hand again to land
      const sh = [sd * 3.4, 4.2, 3.4], elbow = mix([sd * 5.4, 5.8, 1.8], [sd * 4.6, 9.2, 4.2]), hand = mix([sd * 5, 8, 0.5], [sd * 3.8, 12.6, 4.4]);
      L.arm.setAttribute("d", soft([cap(sh, elbow, 1.3, 1), cap(elbow, hand, 1, 0.8), E(Wg, hand, [1.4, 1.6, 0.6])], 2.5, 0.6));
      L.fingers.setAttribute("d", [-0.6, 0, 0.6].map((k) => open([Wg(...hand), Wg(hand[0] + sd * k * 1.6, hand[1] + 1.9, hand[2] - 0.2)])).join(""));
    });
    pupils.forEach((d, i) => place(d, Wb((i ? 1 : -1) * nearS * 2.9 + (i ? 1 : -1) * nearS * 0.4, 6.1, 8.6)));
    // the ripple: a dashed ring that widens from the pad landed on, gone when it has spread
    const pad = PADS[on];
    ripple.setAttribute("d", sp >= 0.99 ? "" : poly(Array.from({ length: 48 }, (_, k) => { const t = (k / 48) * 2 * Math.PI, r = pad[2] + 2 + sp * 10; return P(pad[0] + r * Math.cos(t), pad[1] + r * Math.sin(t), 0); })));
  }
  draw(performance.now());

  const B = register(stage, (_dt, now) => { draw(now); return !tdone(hop, now) || !tdone(face, now) || !tdone(splash, now); });
  bag.add(B.unregister);

  // the hit test: the pointer on the water's plane, against each pad's footprint
  function hit(p) {
    const w = HL.unproj(C, p[0], p[1], 0);
    let best = -1, d = 1e9;
    PADS.forEach(([x, y, r], i) => { const e = Math.hypot(w[0] - x, w[1] - y); if (e < r + 4 && e < d) { d = e; best = i; } });
    return best;
  }

  let pick = -1;
  function choose(i) {
    if (i === pick) return;
    pick = i;
    pads.forEach((pd, k) => pd.top.classList.toggle("hi", k === i));
    pupils.forEach((d) => d.setAttribute("class", i < 0 ? "dot" : "dot m"));
    read.textContent = i < 0 ? "rest" : `pad ${i + 1}`;
    if (i >= 0 && i !== on) {
      const now = performance.now(), p = tval(hop, now);
      // start from wherever it is, on the ground or in the air
      from = [lerp(from[0], to[0], p), lerp(from[1], to[1], p)];
      to = PADS[i];
      on = i;
      let want = (Math.atan2(to[1] - from[1], to[0] - from[0]) * 180) / Math.PI;
      const cur = tval(face, now);
      while (want - cur > 180) want -= 360;
      while (want - cur < -180) want += 360;
      tset(face, want, now, 0);
      hop = tween(0); tset(hop, 1, now, 140);
      splash = tween(0); tset(splash, 1, now, 640);
    }
    B.wake();
  }

  bag.add(pointer(stage, { move: (p) => choose(hit(p)), leave: () => choose(-1) }));
  bag.add(() => svg.replaceChildren());

  return {
    set: (v) => { high = clamp(v, 0, 30); },
    destroy: bag.dispose,
  };
}

hairline({
  name: "frog",
  means: "A frog on a lily pad: point at another pad and it turns, hops across on an arc, and a ripple spreads where it lands.",
  rules: [1, 4, 5, 8],
  range: [4, 9, 14],
  mount,
});
</script>
</body>
